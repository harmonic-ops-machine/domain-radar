name: Neon Branch + Vercel Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-with-neon-branch:
    if: ${{ secrets.NEON_API_KEY != '' && secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Isolated Neon Copy-on-Write Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply Rivalry & Lexical SQL Migration
        run: psql "${{ steps.create-branch.outputs.db_url }}" -f ./migrations/20261126_rivalry_lexical_rates.sql

      - name: Build & Push Preview to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --env DATABASE_URL="${{ steps.create-branch.outputs.db_url }}" --token=${{ secrets.VERCEL_TOKEN }}
